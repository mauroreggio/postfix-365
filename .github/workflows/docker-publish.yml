name: Build and publish Docker image

# Manual only: run it from the "Actions" tab -> "Build and publish Docker image"
# -> "Run workflow". It never runs on push, pull request or schedule.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version (e.g. 1.2.0)"
        required: true
        type: string
      tag_latest:
        description: "Also tag the image as 'latest'"
        required: true
        type: boolean
        default: true
      platforms:
        description: "Target platforms"
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64
          - linux/arm64
      overwrite:
        description: "Allow overwriting an existing version tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate inputs
        id: vars
        env:
          VERSION_INPUT: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${VERSION_INPUT#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION_INPUT' is not valid: use MAJOR.MINOR.PATCH, e.g. 1.2.0 or 1.2.0-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing version
        if: ${{ !inputs.overwrite }}
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists. Choose a new version or tick 'overwrite'."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.tag_latest }}
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: true
          build-args: VERSION=${{ steps.vars.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
